set default="0"
set timeout="0"

menuentry "shredos" {
        linux /boot/bzImage console=tty3 loglevel=3 nomodeset noapic nwipe_options="--method=dodshort --verify=off --autopoweroff --noblank --nousb --autonuke" sftp_key="/etc/ssh_keys/sample.id_rsa" shredos_config="sftp:NNN.NNN.NNN.NNN:/home/<SERVICE ACCT>/shredos-logs/config:<SERVICE ACCT>:<SERVICE ACCT PASSWD>:" shredos_output="sftp:NNN.NNN.NNN.NNN:/home/<SERVICE ACCT>/shredos-logs:<SERVICE_ACCT>:<SERVICE ACCT PASSWD>:"
}
